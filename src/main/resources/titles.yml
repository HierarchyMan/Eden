# Titles Configuration
# Titles are visual badges earned through wins (not Elo)

enabled: true

# Format for displaying titles with player names
# {title} = title display, {name} = player name
format: "[{title}] {name}"

# Define your titles below
# Each title needs: display, short-display (for scoreboards), min-wins, max-wins, priority
# Priority determines which title to show when ranges overlap (higher = preferred)
ranked-match-elo-format: "&8[&b{elo}&8]"
titles:
  unranked:
    display: "&8Unranked"
    short-display: "&8[U]"
    min-wins: 0
    max-wins: 9
    kit-min-wins: 0
    kit-max-wins: 4
    priority: 0
